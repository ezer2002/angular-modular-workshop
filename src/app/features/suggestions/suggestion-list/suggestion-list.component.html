<div class="container">
  <h2>Liste des suggestions</h2>

  <div class="header-actions">
    <div class="search-bar">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        placeholder="Rechercher une suggestion"
        class="search-input">
    </div>
    <button routerLink="add" class="btn-add">➕ Ajouter suggestion</button>
  </div>


  <div class="suggestions-list">
    <div *ngFor="let suggestion of filteredSuggestions" class="suggestion-card">
      <h3>{{ suggestion.title }}</h3>

      <div class="suggestion-meta">
        <span class="category">{{ suggestion.category }}</span>
        <span class="date">{{ suggestion.date | date: 'dd MMM yyyy' }}</span>
      </div>


      <p class="description">{{ suggestion.description }}</p>


      <div class="status-container">
        <span [class]="'status status-' + suggestion.status">
          {{ suggestion.status.toUpperCase().replace('_', ' ') }}
        </span>
      </div>

    
      <div class="actions">
        <button [routerLink]="[suggestion.id]" class="btn-details">
          👁️ Voir détails
        </button>
   
        <button *ngIf="suggestion.status !== 'refusee'" (click)="likeSuggestion(suggestion)" class="btn-like">
          👍 Like {{ suggestion.nbLikes }}
        </button>

        <button *ngIf="suggestion.status !== 'refusee'" (click)="addToFavorites(suggestion)" class="btn-favorite">
          ♥ Ajouter aux favoris
        </button>

        <button (click)="deleteSuggestion(suggestion.id)" class="btn-delete">
          🗑️ Supprimer
        </button>
      </div>
    </div>
  </div>


  <div *ngIf="filteredSuggestions.length === 0" class="no-results">
    Aucune suggestion trouvée pour "{{ searchTerm }}"
  </div>
</div>
